<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Location</title>
<style>
body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
.folder { background: #eef5ff; padding: 20px; margin: 10px 0; border-radius: 10px; cursor: pointer; font-size: 18px; }
.folder:hover { background: #d3e3fd; }
#result { margin-top: 20px; padding: 20px; background: #f0fff4; border-radius: 10px; display: none; border: 2px solid #23c552; }
</style>
</head>
<body>

<h2>📁 Test Folders</h2>

<div class="folder" onclick="doTest('Pics')">📷 Click: My Pics</div>
<div class="folder" onclick="doTest('Work')">📝 Click: School Work</div>
<div class="folder" onclick="doTest('Holiday')">✈️ Click: Holiday</div>

<div id="result">
<strong>✅ Location Found!</strong><br><br>
Folder: <span id="which"></span><br>
Latitude: <span id="lat"></span><br>
Longitude: <span id="lng"></span>
</div>

<script>
function doTest(folderName) {
  // Check if opened correctly
  if (location.protocol !== 'https:' && location.protocol !== 'http:') {
    alert('❌ PROBLEM:\nYou opened this as a local file.\n\nLocation will NOT work here.\nUpload to GitHub Pages or run on a server instead.');
    return;
  }

  // Check GPS support
  if (!navigator.geolocation) {
    alert('❌ Your browser does not support location');
    return;
  }

  // Ask for & show location
  navigator.geolocation.getCurrentPosition(
    function success(pos) {
      document.getElementById('which').textContent = folderName;
      document.getElementById('lat').textContent = pos.coords.latitude.toFixed(6);
      document.getElementById('lng').textContent = pos.coords.longitude.toFixed(6);
      document.getElementById('result').style.display = 'block';
    },
    function fail(err) {
      let msg = '❌ Error:\n';
      if (err.code === 1) msg += 'You blocked location — tap 🔒 in address bar → Allow Location';
      if (err.code === 2) msg += 'Location unavailable — turn on GPS/Location in settings';
      if (err.code === 3) msg += 'Timed out — try again outdoors or with Wi‑Fi on';
      alert(msg);
    },
    { enableHighAccuracy: true, timeout: 15000 }
  );
}
</script>

</body>
</html>
