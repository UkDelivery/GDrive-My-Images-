<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Drive</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <div class="logo">
        <span class="logo-icon">📁</span>
        <span>My Drive</span>
    </div>
    <div class="search">
        🔍
        <input type="text" id="searchInput" placeholder="Search in Drive">
    </div>
    <div class="avatar">M</div>
</header>

<div class="layout">
<aside class="sidebar">
    <div class="new-button-container">
        <button class="new-button" id="newBtn">＋ New</button>
        <div class="new-dropdown" id="newDropdown">
            <div class="new-dropdown-item">📄 Upload file</div>
            <div class="new-dropdown-item">📁 New folder</div>
            <div class="new-dropdown-item">📝 Google Docs</div>
            <div class="new-dropdown-item">📊 Google Sheets</div>
        </div>
    </div>
    <div class="nav-item active" data-nav="home">🏠 Home</div>
    <div class="nav-item" data-nav="my-drive">📁 My Drive</div>
    <div class="nav-item" data-nav="shared">👥 Shared with me</div>
    <div class="nav-item" data-nav="recent">🕘 Recent</div>
    <div class="nav-item" data-nav="starred">⭐ Starred</div>
    <div class="nav-item" data-nav="trash">🗑️ Trash</div>
</aside>

<main class="main">
<div id="homePage">
    <div class="heading">
        <h2>Welcome to My Drive</h2>
        <span>☷　▦</span>
    </div>
    <h3>Folders</h3>
    <div class="folder-grid" id="folderGrid">
        <div class="folder" data-folder="My Pics😉" onclick="openFolder('My Pics😉')">
            <div class="folder-icon">📁</div>
            <div class="folder-name">My Pics😉</div>
        </div>
        <div class="folder" data-folder="School work" onclick="openFolder('School work')">
            <div class="folder-icon">📁</div>
            <div class="folder-name">School work</div>
        </div>
        <div class="folder" data-folder="Holiday⛱️" onclick="openFolder('Holiday⛱️')">
            <div class="folder-icon">📁</div>
            <div class="folder-name">Holiday⛱️</div>
        </div>
        <div class="folder" data-folder="Friends" onclick="openFolder('Friends')">
            <div class="folder-icon">📁</div>
            <div class="folder-name">Friends</div>
        </div>
        <div class="folder" data-folder="Ex" onclick="openFolder('Ex')">
            <div class="folder-icon">📁</div>
            <div class="folder-name">Ex</div>
        </div>
    </div>
</div>

<div id="folderPage" class="folder-page">
    <button class="back-button" onclick="goHome()">← Back to Drive</button>
    <h2 id="folderTitle">📁 Folder</h2>
    <div id="folderContents"></div>
</div>
</main>
</div>

<script>
const folderContents = {
    'My Pics😉': ['sunset.jpg', 'beach.png', 'family.jpeg', 'mountains.png'],
    'School work': ['essay.docx', 'project slides.pdf', 'notes.txt', 'research-data.csv'],
    'Holiday⛱️': ['itinerary.pdf', 'tickets.eml', 'photos.zip', 'hotel-booking.pdf'],
    'Friends': ['group-photo.jpg', 'birthday-party.mp4', 'reunion-2026.png'],
    'Ex': []
};

function openFolder(folderName) {
    document.getElementById("homePage").style.display = "none";
    document.getElementById("folderPage").style.display = "block";
    document.getElementById("folderTitle").textContent = "📁 " + folderName;
    
    const files = folderContents[folderName] || [];
    const contentsDiv = document.getElementById("folderContents");
    contentsDiv.innerHTML = files.length
        ? `<ul>${files.map(f => `<li>📄 ${f}</li>`).join('')}</ul>`
        : '<p>This folder is empty.</p>';
}

function goHome() {
    document.getElementById("folderPage").style.display = "none";
    document.getElementById("homePage").style.display = "block";
}

document.getElementById('searchInput').addEventListener('input', e => {
    const query = e.target.value.toLowerCase();
    document.querySelectorAll('.folder').forEach(folder => {
        const name = folder.dataset.folder.toLowerCase();
        folder.style.display = name.includes(query) ? '' : 'none';
    });
});

document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', function() {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
    });
});

const newBtn = document.getElementById('newBtn');
const newDropdown = document.getElementById('newDropdown');
newBtn.addEventListener('click', e => {
    e.stopPropagation();
    newDropdown.classList.toggle('show');
});
document.addEventListener('click', () => newDropdown.classList.remove('show'));
newDropdown.addEventListener('click', e => e.stopPropagation());
</script>

</body>
</html>
