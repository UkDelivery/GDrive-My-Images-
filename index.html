<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Drive</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8fafd;
    color: #202124;
}

/* TOP BAR */

.topbar {
    height: 70px;
    background: white;
    border-bottom: 1px solid #dadce0;

    display: flex;
    align-items: center;

    padding: 0 25px;
    gap: 30px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 23px;
    white-space: nowrap;
}

.logo-icon {
    font-size: 30px;
}

.search {
    background: #edf2fa;
    border-radius: 25px;

    padding: 12px 18px;

    width: 50%;
    max-width: 600px;
}

.search input {
    border: none;
    outline: none;
    background: transparent;

    width: 90%;

    font-size: 15px;
}

.avatar {
    margin-left: auto;

    background: #4285f4;
    color: white;

    width: 40px;
    height: 40px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;
}

/* LAYOUT */

.layout {
    display: flex;
    min-height: calc(100vh - 70px);
}

/* SIDEBAR */

.sidebar {
    width: 230px;
    padding: 20px 12px;
}

.new-button {
    background: white;

    border: 1px solid #dadce0;

    border-radius: 15px;

    padding: 14px 25px;

    font-size: 15px;

    cursor: pointer;

    margin-bottom: 25px;
}

.new-button:hover {
    background: #f1f3f4;
}

.nav-item {
    padding: 13px 18px;

    border-radius: 25px;

    margin-bottom: 5px;

    cursor: pointer;
}

.nav-item:hover {
    background: #edf2fa;
}

.nav-item.active {
    background: #d3e3fd;
}

/* MAIN */

.main {
    flex: 1;
    padding: 30px;
}

.heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.heading h2 {
    margin-top: 0;
}

/* FOLDERS */

.folder-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(190px, 1fr));

    gap: 16px;

    margin-top: 20px;
}

.folder {
    background: white;

    border: 1px solid #dadce0;

    border-radius: 12px;

    padding: 20px;

    cursor: pointer;

    transition: 0.15s;
}

.folder:hover {
    background: #f1f6ff;
    transform: translateY(-2px);
}

.folder-icon {
    font-size: 35px;
}

.folder-name {
    margin-top: 15px;

    font-size: 16px;

    font-weight: 500;
}

/* OPEN FOLDER */

.folder-page {
    display: none;
}

.back-button {
    background: #d3e3fd;

    border: none;

    border-radius: 20px;

    padding: 10px 18px;

    cursor: pointer;

    margin-bottom: 20px;

    font-size: 14px;
}

.back-button:hover {
    background: #b9d4fa;
}

/* MOBILE */

@media (max-width: 700px) {

    .topbar {
        padding: 0 10px;
        gap: 10px;
    }

    .logo span {
        display: none;
    }

    .search {
        width: 65%;
    }

    .sidebar {
        width: 90px;
        padding: 15px 5px;
    }

    .nav-item {
        font-size: 11px;
        padding: 12px 5px;
        text-align: center;
    }

    .new-button {
        width: 100%;
        padding: 12px 5px;
    }

    .main {
        padding: 18px;
    }

}

</style>
</head>


<body>


<!-- TOP BAR -->

<header class="topbar">

    <div class="logo">

        <span class="logo-icon">
            📁
        </span>

        <span>
            My Drive
        </span>

    </div>


    <div class="search">

        🔍

        <input
            type="text"
            placeholder="Search in Drive"
        >

    </div>


    <div class="avatar">
        M
    </div>

</header>



<div class="layout">


<!-- SIDEBAR -->

<aside class="sidebar">

    <button class="new-button">
        ＋ New
    </button>


    <div class="nav-item active">
        🏠 Home
    </div>


    <div class="nav-item">
        📁 My Drive
    </div>


    <div class="nav-item">
        👥 Shared with me
    </div>


    <div class="nav-item">
        🕘 Recent
    </div>


    <div class="nav-item">
        ⭐ Starred
    </div>


    <div class="nav-item">
        🗑️ Trash
    </div>

</aside>



<!-- MAIN CONTENT -->

<main class="main">


<!-- HOME PAGE -->

<div id="homePage">

    <div class="heading">

        <h2>
            Welcome to My Drive
        </h2>

        <span>
            ☷　▦
        </span>

    </div>


    <h3>
        Folders
    </h3>


    <div class="folder-grid">


        <!-- MY PICS -->

        <div
            class="folder"
            onclick="openFolder('My Pics😉')"
        >

            <div class="folder-icon">
                📁
            </div>

            <div class="folder-name">
                My Pics😉
            </div>

        </div>


        <!-- SCHOOL WORK -->

        <div
            class="folder"
            onclick="openFolder('School work')"
        >

            <div class="folder-icon">
                📁
            </div>

            <div class="folder-name">
                School work
            </div>

        </div>


        <!-- HOLIDAY -->

        <div
            class="folder"
            onclick="openFolder('Holiday⛱️')"
        >

            <div class="folder-icon">
                📁
            </div>

            <div class="folder-name">
                Holiday⛱️
            </div>

        </div>


        <!-- FRIENDS -->

        <div
            class="folder"
            onclick="openFolder('Friends')"
        >

            <div class="folder-icon">
                📁
            </div>

            <div class="folder-name">
                Friends
            </div>

        </div>


        <!-- EX -->

        <div
            class="folder"
            onclick="openFolder('Ex')"
        >

            <div class="folder-icon">
                📁
            </div>

            <div class="folder-name">
                Ex
            </div>

        </div>


    </div>

</div>



<!-- FOLDER PAGE -->

<div
    id="folderPage"
    class="folder-page"
>

    <button
        class="back-button"
        onclick="goHome()"
    >
        ← Back to Drive
    </button>


    <h2 id="folderTitle">
        📁 Folder
    </h2>


    <p>
        This folder is empty.
    </p>

</div>


</main>

</div>



<script>

function openFolder(folderName) {

    document
        .getElementById("homePage")
        .style.display = "none";


    document
        .getElementById("folderPage")
        .style.display = "block";


    document
        .getElementById("folderTitle")
        .textContent = "📁 " + folderName;

}


function goHome() {

    document
        .getElementById("folderPage")
        .style.display = "none";


    document
        .getElementById("homePage")
        .style.display = "block";

}

</script>


</body>
</html>
