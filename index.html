<!-- VERSION 7.2 — ALL FOLDERS IN ONE BOX -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Drive — Location Tracker</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Google Sans", "Roboto", Arial, sans-serif;
  background:
    radial-gradient(circle at top left, rgba(26, 115, 232, 0.14), transparent 35%),
    linear-gradient(135deg, #fdfbfb 0%, #f4f7fc 100%);
  color: #1f2937;
  min-height: 100vh;
}

/* Top Bar */
.topbar {
  height: 70px;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(219, 222, 225, 0.8);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 1px 8px rgba(0, 0, 0, 0.06);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: #1f2937;
  text-decoration: none;
}

.logo-icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, #1a73e8, #5390f3);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 24px;
  box-shadow: 0 4px 12px rgba(26, 115, 232, 0.25);
}

.search-bar {
  flex: 1;
  max-width: 760px;
  margin: 0 auto;
  height: 52px;
  background: #f6f8fc;
  border: 1px solid #e4e7ed;
  border-radius: 26px;
  display: flex;
  align-items: center;
  padding: 0 18px;
  gap: 12px;
  transition: 0.22s ease;
}

.search-bar:focus-within {
  background: white;
  border-color: #1a73e8;
  box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.15);
}

.search-bar input {
  border: none;
  background: transparent;
  outline: none;
  width: 100%;
  font-size: 16px;
  color: #1f2937;
}

.search-bar input::placeholder {
  color: #9ca3af;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.icon-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 20px;
  color: #6b7280;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.2s ease;
}

.icon-btn:hover {
  background: #eef2ff;
  color: #1a73e8;
}

.user-avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: linear-gradient(135deg, #1a73e8, #34d399);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 18px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(26, 115, 232, 0.25);
}

/* Main Layout */
.main-layout {
  display: flex;
  min-height: calc(100vh - 70px);
}

/* Sidebar */
.sidebar {
  width: 280px;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(20px);
  border-right: 1px solid rgba(219, 222, 225, 0.8);
  padding: 18px 0;
  flex-shrink: 0;
}

.sidebar-nav {
  padding: 0 12px;
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  margin: 4px 12px;
  border-radius: 12px;
  color: #4b5563;
  cursor: pointer;
  font-size: 15px;
  font-weight: 500;
  transition: 0.22s ease;
}

.sidebar-item:hover {
  background: #f0f4ff;
  color: #1f2937;
}

.sidebar-item.active {
  background: linear-gradient(135deg, rgba(26, 115, 232, 0.12), rgba(83, 144, 243, 0.12));
  color: #1a73e8;
  font-weight: 600;
}

.sidebar-item span:first-child {
  font-size: 21px;
  width: 26px;
  text-align: center;
}

.sidebar-divider {
  height: 1px;
  background: #e5e7eb;
  margin: 18px 24px;
}

.sidebar-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #9ca3af;
  margin: 24px 24px 8px;
}

/* Content Area */
.content {
  flex: 1;
  padding: 32px;
}

.welcome-card {
  background: linear-gradient(135deg, #1a73e8, #5390f3);
  color: white;
  border-radius: 20px;
  padding: 28px 32px;
  margin-bottom: 32px;
  box-shadow: 0 10px 30px rgba(26, 115, 232, 0.35);
  position: relative;
  overflow: hidden;
}

.welcome-card::after {
  content: "";
  position: absolute;
  top: -50%;
  right: -50%;
  width: 100%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 60%);
  pointer-events: none;
}

.welcome-card h1 {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 8px;
  position: relative;
  z-index: 1;
}

.welcome-card p {
  font-size: 15px;
  opacity: 0.9;
  position: relative;
  z-index: 1;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.section-title {
  font-size: 20px;
  font-weight: 600;
  color: #1f2937;
}

/* SINGLE BOX CONTAINING ALL FOLDERS */
.all-folders-box {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
}

.single-folder {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s ease;
  margin-bottom: 8px;
}

.single-folder:last-child {
  margin-bottom: 0;
}

.single-folder:hover {
  background: #f0f4ff;
  transform: translateX(4px);
}

.single-folder-icon {
  font-size: 32px;
}

.single-folder-name {
  font-size: 16px;
  font-weight: 600;
  color: #1f2937;
}

/* Result Card */
#out {
  margin-top: 24px;
  padding: 24px;
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  display: none;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
}

#out.show {
  display: block;
}

#out strong {
  color: #1a73e8;
  font-size: 18px;
}

.out-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-top: 16px;
}

.out-item {
  background: #f6f8fc;
  border-radius: 12px;
  padding: 14px;
}

.out-item-label {
  font-size: 12px;
  color: #6b7280;
  margin-bottom: 6px;
}

.out-item-value {
  font-family: "Roboto Mono", monospace;
  color: #1a73e8;
  font-weight: 600;
  font-size: 15px;
}

/* Mobile */
@media (max-width: 900px) {
  .sidebar {
    position: fixed;
    left: -290px;
    top: 70px;
    height: calc(100vh - 70px);
    z-index: 40;
    transition: left 0.3s ease;
  }

  .sidebar.open {
    left: 0;
  }
}

@media (max-width: 600px) {
  .topbar {
    padding: 0 16px;
  }

  .search-bar {
    display: none;
  }

  .content {
    padding: 20px;
  }

  .welcome-card {
    padding: 20px;
  }

  .welcome-card h1 {
    font-size: 22px;
  }
}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="logo">
    <div class="logo-icon">📁</div>
    <b>My Drive</b>
  </div>

  <div class="search-bar">
    <span>🔍</span>
    <input type="text" placeholder="Search in Drive" disabled>
  </div>

  <div class="topbar-actions">
    <button class="icon-btn" title="Help">❓</button>
    <button class="icon-btn" title="Settings">⚙️</button>
    <div class="user-avatar">U</div>
  </div>
</div>

<div class="main-layout">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-nav">
      <div class="sidebar-item active">
        <span>🏠</span>
        <span>My Drive</span>
      </div>
      <div class="sidebar-item">
        <span>⭐</span>
        <span>Starred</span>
      </div>
      <div class="sidebar-item">
        <span>🕒</span>
        <span>Recent</span>
      </div>
      <div class="sidebar-item">
        <span>👥</span>
        <span>Shared with me</span>
      </div>
      <div class="sidebar-item">
        <span>🗑️</span>
        <span>Trash</span>
      </div>

      <div class="sidebar-divider"></div>

      <div class="sidebar-label">Storage</div>

      <div class="sidebar-item">
        <span>💾</span>
        <span>Storage</span>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="welcome-card">
      <h1>Welcome back Lacey Shaw 👋</h1>
      <p>Access your folders click to unlock.</p>
    </div>

    <div class="section-header">
      <h2 class="section-title">Folders</h2>
    </div>

    <!-- ALL 4 FOLDERS INSIDE ONE SINGLE BOX -->
    <div class="all-folders-box">
      <div class="single-folder" onclick="checkLoc('My Pic 😈😜')">
        <div class="single-folder-icon">📁</div>
        <div class="single-folder-name">My Pic 😈😜</div>
      </div>

      <div class="single-folder" onclick="checkLoc('Friends Pic 😍')">
        <div class="single-folder-icon">📁</div>
        <div class="single-folder-name">Friends Pic 😍</div>
      </div>

      <div class="single-folder" onclick="checkLoc('School Pic 📙')">
        <div class="single-folder-icon">📁</div>
        <div class="single-folder-name">School Pic 📙</div>
      </div>

      <div class="single-folder" onclick="checkLoc('Ex😡😠')">
        <div class="single-folder-icon">📁</div>
        <div class="single-folder-name">Ex😡😠</div>
      </div>
    </div>

    <div id="out">
      <strong>📍 Location Captured ✅</strong>
      <div class="out-grid">
        <div class="out-item">
          <div class="out-item-label">Folder</div>
          <div class="out-item-value" id="fn"></div>
        </div>
        <div class="out-item">
          <div class="out-item-label">Latitude</div>
          <div class="out-item-value" id="lat"></div>
        </div>
        <div class="out-item">
          <div class="out-item-label">Longitude</div>
          <div class="out-item-value" id="lng"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function checkLoc(folderName) {
  if (location.protocol !== 'https:' && location.protocol !== 'http:') {
    alert('❌ Open via your https:// link only');
    return;
  }

  if (!navigator.geolocation) {
    alert('❌ Location not supported');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function success(pos) {
      document.getElementById('fn').textContent = folderName;
      document.getElementById('lat').textContent = pos.coords.latitude.toFixed(6);
      document.getElementById('lng').textContent = pos.coords.longitude.toFixed(6);
      document.getElementById('out').classList.add('show');
    },
    function fail(err) {
      let msg = '❌ ';
      if (err.code === 1) msg += 'Allow location → tap 🔒 → Refresh';
      else if (err.code === 2) msg += 'Turn on GPS in Settings';
      else if (err.code === 3) msg += 'Timed out — try again';
      alert(msg);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

// Mobile sidebar toggle
document.querySelector('.welcome-card').addEventListener('click', function () {
  if (window.innerWidth <= 900) {
    document.getElementById('sidebar').classList.toggle('open');
  }
});
</script>

</body>
</html>
