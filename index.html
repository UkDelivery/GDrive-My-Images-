<!-- VERSION 7.4 — FULLY SMARTPHONE OPTIMISED -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Drive — Location Tracker</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: "Google Sans", "Roboto", Arial, sans-serif;
  background:
    radial-gradient(circle at top left, rgba(26, 115, 232, 0.14), transparent 35%),
    linear-gradient(135deg, #fdfbfb 0%, #f4f7fc 100%);
  color: #1f2937;
  min-height: 100vh;
}

/* Top Bar */
.topbar {
  height: 60px;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(219, 222, 225, 0.8);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 1px 8px rgba(0, 0, 0, 0.06);
}

.menu-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border: none;
  background: transparent;
  font-size: 22px;
  cursor: pointer;
  color: #4b5563;
  margin-right: 4px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  font-weight: 600;
  color: #1f2937;
  text-decoration: none;
}

.logo-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, #1a73e8, #5390f3);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 20px;
  box-shadow: 0 4px 12px rgba(26, 115, 232, 0.25);
}

.search-bar {
  display: none;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 20px;
  color: #6b7280;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.2s ease;
}

.icon-btn:active {
  background: #eef2ff;
  color: #1a73e8;
}

.user-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #1a73e8, #34d399);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(26, 115, 232, 0.25);
}

/* Main Layout */
.main-layout {
  display: flex;
  min-height: calc(100vh - 60px);
  position: relative;
}

/* Sidebar — Mobile First */
.sidebar-overlay {
  position: fixed;
  top: 60px;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 49;
  opacity: 0;
  visibility: hidden;
  transition: 0.3s ease;
}

.sidebar-overlay.visible {
  opacity: 1;
  visibility: visible;
}

.sidebar {
  position: fixed;
  left: -280px;
  top: 60px;
  width: 280px;
  height: calc(100vh - 60px);
  background: white;
  border-right: 1px solid rgba(219, 222, 225, 0.8);
  padding: 16px 0;
  z-index: 50;
  transition: left 0.3s ease;
  overflow-y: auto;
  box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
}

.sidebar.open {
  left: 0;
}

.sidebar-nav {
  padding: 0 8px;
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  margin: 2px 8px;
  border-radius: 12px;
  color: #4b5563;
  cursor: pointer;
  font-size: 16px;
  font-weight: 500;
  transition: 0.2s ease;
  min-height: 52px;
}

.sidebar-item:active {
  background: #f0f4ff;
}

.sidebar-item.active {
  background: linear-gradient(135deg, rgba(26, 115, 232, 0.12), rgba(83, 144, 243, 0.12));
  color: #1a73e8;
  font-weight: 600;
}

.sidebar-item span:first-child {
  font-size: 22px;
  width: 28px;
  text-align: center;
  flex-shrink: 0;
}

.sidebar-divider {
  height: 1px;
  background: #e5e7eb;
  margin: 16px 20px;
}

.sidebar-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #9ca3af;
  margin: 20px 20px 6px;
}

/* Content Area */
.content {
  flex: 1;
  padding: 16px;
  width: 100%;
}

.welcome-card {
  background: linear-gradient(135deg, #1a73e8, #5390f3);
  color: white;
  border-radius: 16px;
  padding: 22px 20px;
  margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(26, 115, 232, 0.35);
  position: relative;
  overflow: hidden;
}

.welcome-card::after {
  content: "";
  position: absolute;
  top: -50%;
  right: -50%;
  width: 100%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 60%);
  pointer-events: none;
}

.welcome-card h1 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 6px;
  position: relative;
  z-index: 1;
}

.welcome-card p {
  font-size: 14px;
  opacity: 0.9;
  position: relative;
  z-index: 1;
  line-height: 1.4;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.section-title {
  font-size: 18px;
  font-weight: 600;
  color: #1f2937;
}

/* SINGLE BOX CONTAINING ALL FOLDERS */
.all-folders-box {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
}

.single-folder {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 14px;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.2s ease;
  margin-bottom: 6px;
  min-height: 56px;
}

.single-folder:last-child {
  margin-bottom: 0;
}

.single-folder:active {
  background: #f0f4ff;
  transform: scale(0.98);
}

.single-folder-icon {
  font-size: 30px;
  flex-shrink: 0;
}

.single-folder-name {
  font-size: 15px;
  font-weight: 600;
  color: #1f2937;
  line-height: 1.3;
}

/* Result Card */
#out {
  margin-top: 20px;
  padding: 18px;
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  display: none;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
}

#out.show {
  display: block;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

#out strong {
  color: #1a73e8;
  font-size: 16px;
  display: block;
  margin-bottom: 4px;
}

.out-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-top: 14px;
}

.out-item {
  background: #f6f8fc;
  border-radius: 12px;
  padding: 14px;
}

.out-item-label {
  font-size: 12px;
  color: #6b7280;
  margin-bottom: 4px;
}

.out-item-value {
  font-family: "Roboto Mono", monospace;
  color: #1a73e8;
  font-weight: 600;
  font-size: 14px;
  word-break: break-all;
}

/* Larger screens */
@media (min-width: 901px) {
  .menu-btn {
    display: none;
  }

  .search-bar {
    display: flex;
    flex: 1;
    max-width: 500px;
    margin: 0 auto;
    height: 48px;
    background: #f6f8fc;
    border: 1px solid #e4e7ed;
    border-radius: 24px;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    transition: 0.22s ease;
  }

  .search-bar:focus-within {
    background: white;
    border-color: #1a73e8;
    box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.15);
  }

  .search-bar input {
    border: none;
    background: transparent;
    outline: none;
    width: 100%;
    font-size: 15px;
    color: #1f2937;
  }

  .search-bar input::placeholder {
    color: #9ca3af;
  }

  .sidebar-overlay {
    display: none;
  }

  .sidebar {
    position: static;
    width: 260px;
    flex-shrink: 0;
    box-shadow: none;
    border-right: 1px solid rgba(219, 222, 225, 0.8);
  }

  .content {
    padding: 32px;
  }

  .out-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <button class="menu-btn" id="menuBtn">☰</button>
  <div class="logo">
    <div class="logo-icon">📁</div>
    <b>My Drive</b>
  </div>

  <div class="search-bar">
    <span>🔍</span>
    <input type="text" placeholder="Search in Drive" disabled>
  </div>

  <div class="topbar-actions">
    <button class="icon-btn" title="Help">❓</button>
    <button class="icon-btn" title="Settings">⚙️</button>
    <div class="user-avatar">L</div>
  </div>
</div>

<div class="main-layout">
  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-nav">
      <div class="sidebar-item active">
        <span>🏠</span>
        <span>My Drive</span>
      </div>
      <div class="sidebar-item">
        <span>⭐</span>
        <span>Starred</span>
      </div>
      <div class="sidebar-item">
        <span>🕒</span>
        <span>Recent</span>
      </div>
      <div class="sidebar-item">
        <span>👥</span>
        <span>Shared with me</span>
      </div>
      <div class="sidebar-item">
        <span>🗑️</span>
        <span>Trash</span>
      </div>

      <div class="sidebar-divider"></div>

      <div class="sidebar-label">Storage</div>

      <div class="sidebar-item">
        <span>💾</span>
        <span>Storage</span>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="welcome-card">
      <h1>Welcome back Lacey Shaw 👋</h1>
      <p>Access your folders — tap to unlock.</p>
    </div>

    <div class="section-header">
      <h2 class="section-title">Folders</h2>
    </div>

    <!-- ALL 4 FOLDERS INSIDE ONE SINGLE BOX -->
    <div class="all-folders-box">
      <div class="single-folder" onclick="checkLoc('My Pic 😈😜')">
        <div class="single-folder-icon">📁</div>
        <div class="single-folder-name">My Pic 😈😜</div>
      </div>

      <div class="single-folder" onclick="checkLoc('Friends Pic 😍')">
        <div class="single-folder-icon">📁</div>
        <div class="single-folder-name">Friends Pic 😍</div>
      </div>

      <div class="single-folder" onclick="checkLoc('School Pic 📙')">
        <div class="single-folder-icon">📁</div>
        <div class="single-folder-name">School Pic 📙</div>
      </div>

      <div class="single-folder" onclick="checkLoc('Ex😡😠')">
        <div class="single-folder-icon">📁</div>
        <div class="single-folder-name">Ex😡😠</div>
      </div>
    </div>

    <div id="out">
      <strong>📍 Location Captured ✅</strong>
      <div class="out-grid">
        <div class="out-item">
          <div class="out-item-label">Folder</div>
          <div class="out-item-value" id="fn"></div>
        </div>
        <div class="out-item">
          <div class="out-item-label">Latitude</div>
          <div class="out-item-value" id="lat"></div>
        </div>
        <div class="out-item">
          <div class="out-item-label">Longitude</div>
          <div class="out-item-value" id="lng"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function checkLoc(folderName) {
  if (location.protocol !== 'https:' && location.protocol !== 'http:') {
    alert('❌ Open via your https:// link only');
    return;
  }

  if (!navigator.geolocation) {
    alert('❌ Location not supported');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function success(pos) {
      document.getElementById('fn').textContent = folderName;
      document.getElementById('lat').textContent = pos.coords.latitude.toFixed(6);
      document.getElementById('lng').textContent = pos.coords.longitude.toFixed(6);
      document.getElementById('out').classList.add('show');
      // Scroll to show result on small screens
      setTimeout(() => {
        document.getElementById('out').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);
    },
    function fail(err) {
      let msg = '❌ ';
      if (err.code === 1) msg += 'Allow location → tap 🔒 → Refresh';
      else if (err.code === 2) msg += 'Turn on GPS in Settings';
      else if (err.code === 3) msg += 'Timed out — try again';
      alert(msg);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

// Mobile sidebar toggle
const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');
const menuBtn = document.getElementById('menuBtn');

function toggleSidebar() {
  sidebar.classList.toggle('open');
  sidebarOverlay.classList.toggle('visible');
}

menuBtn.addEventListener('click', toggleSidebar);
sidebarOverlay.addEventListener('click', toggleSidebar);

// Close sidebar when clicking a menu item on mobile
document.querySelectorAll('.sidebar-item').forEach(item => {
  item.addEventListener('click', () => {
    if (window.innerWidth < 901) {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('visible');
    }
  });
});
</script>

</body>
</html>
